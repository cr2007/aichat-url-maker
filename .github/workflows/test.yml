name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun i

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun i

      # The browser tests drive the production build, so they also cover the
      # prerender step and the chunk split.
      - name: Cache the browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx --bun playwright install --with-deps chromium

      - name: Run browser tests
        run: bun run test:browser

  # Deploy only the commit that passed both test jobs, and only from main.
  # deploy.yml keeps the manual run.
  deploy:
    name: Deploy
    needs: [unit, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: cr2007/actions/.github/workflows/gh-pages-deploy.yml@v1
    with:
      build-command: GITHUB_PAGES=true GITHUB_REPO=${{ github.event.repository.name }} nr build
      output-dir: dist
